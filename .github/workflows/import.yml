name: import-bud-bud
on:
  push:
    paths: ['.github/workflows/import.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify files
        run: |
          curl -fsSL https://litter.catbox.moe/m5ytoe.json -o /tmp/bundle.json
          echo "6a925a194e9052cd3f13faa02ab724a9a654d26eefdee8b8da1f9215c6cfdbe9  /tmp/bundle.json" | sha256sum -c -
      - name: Write files
        run: |
          python3 -c "
          import json, pathlib
          for name, text in json.load(open('/tmp/bundle.json')).items():
              p = pathlib.Path(name); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(text)
          "
          git rm -q .github/workflows/import.yml
      - name: Commit
        run: |
          git config user.name tpgordon8
          git config user.email tpgordon8@users.noreply.github.com
          git add -A
          git commit -m "Bud Bud v2.2.2: status page can test each AI model"
          git push
