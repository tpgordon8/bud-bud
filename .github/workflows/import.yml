name: import-bud-bud
on:
  push:
    paths: ['.github/workflows/import.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify files
        run: |
          curl -fsSL https://litter.catbox.moe/s54nc0.json -o /tmp/bundle.json
          echo "ac80a9ad3e878d9d4ee279b556f4a36e078d91c226b6314cb9444f6e5e61c672  /tmp/bundle.json" | sha256sum -c -
      - name: Write files
        run: |
          python3 -c "
          import json, pathlib
          for name, text in json.load(open('/tmp/bundle.json')).items():
              p = pathlib.Path(name); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(text)
          "
          git rm -q .github/workflows/import.yml
      - name: Commit
        run: |
          git config user.name tpgordon8
          git config user.email tpgordon8@users.noreply.github.com
          git add -A
          git commit -m "Bud Bud v2.3.0: fast model first"
          git push
