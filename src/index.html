<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bud Bud</title>
<script>/*__CFG__*/</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#EEF0E8; --surface:#F9FAF5; --ink:#211B26; --muted:#5E5866;
  --plum:#5B3A5E; --plum-soft:#E7DEE9; --resin:#B97B10; --resin-soft:#F3E3C2;
  --sage:#5F7D5A; --sage-soft:#DCE6D8; --line:#D3D7CB; --danger:#A33B2B;
  --on-plum:#FBF8FC;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16131A; --surface:#211D26; --ink:#EEE9F0; --muted:#A9A1B0;
    --plum:#CBA8CF; --plum-soft:#3A2B3E; --resin:#E3AC45; --resin-soft:#3E311B;
    --sage:#9DBA96; --sage-soft:#26332A; --line:#37313D; --danger:#E58A78; --on-plum:#1D1422;
  }
}
:root[data-theme="dark"]{
  --paper:#16131A; --surface:#211D26; --ink:#EEE9F0; --muted:#A9A1B0;
  --plum:#CBA8CF; --plum-soft:#3A2B3E; --resin:#E3AC45; --resin-soft:#3E311B;
  --sage:#9DBA96; --sage-soft:#26332A; --line:#37313D; --danger:#E58A78; --on-plum:#1D1422;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--body)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:640px;margin:0 auto;padding:0 20px 56px}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 8px}
.wordmark{font:800 22px/1 var(--display);letter-spacing:-.02em;background:none;border:0;padding:6px 0;cursor:pointer;color:var(--plum)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px}
.ghost:hover{border-color:var(--plum)}
:focus-visible{outline:3px solid var(--resin);outline-offset:2px}

h1{font:800 clamp(44px,12vw,72px)/.95 var(--display);letter-spacing:-.035em;margin:40px 0 16px}
h2{font:700 24px/1.2 var(--display);letter-spacing:-.01em;margin:36px 0 10px}
h3{font:700 18px/1.3 var(--display);margin:0 0 4px}
p{margin:0 0 12px}
.lede{font-size:19px;color:var(--muted);max-width:32ch;margin-bottom:28px}
.muted{color:var(--muted)}
.small{font-size:15px}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:18px;border:0;cursor:pointer;font:700 19px/1.2 var(--display);padding:14px 20px;text-decoration:none}
.btn-primary{background:var(--plum);color:var(--on-plum)}
.btn-primary:active{transform:scale(.99)}
.btn-secondary{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-secondary:hover{border-color:var(--plum)}
.btn[disabled]{opacity:.5;cursor:default}
.stack{display:grid;gap:12px}
.linkrow{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px}
.textlink{background:none;border:0;padding:4px 0;color:var(--plum);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:16px}

.note{background:var(--resin-soft);border-radius:14px;padding:12px 16px;font-size:15px;margin:16px 0}
.note.warn{background:var(--plum-soft)}
.note.err{border-left:4px solid var(--danger)}

/* recent list */
.jars{display:grid;gap:10px;margin-top:12px}
.jars>*{min-width:0}
.jar{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;text-align:left;width:100%}
.jar:hover{border-color:var(--plum)}
.jar img,.jar .ph{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--sage-soft)}
.jar .meta{flex:1;min-width:0}
.jar .nm,.jar .sub{display:block}
.jar .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jar .sub{font-size:14px;color:var(--muted)}
.jar .pct{font:800 22px/1 var(--display);color:var(--plum)}

/* reading */
.scan{position:relative;border-radius:20px;overflow:hidden;margin:20px 0 16px;background:var(--surface);max-height:40vh;display:flex;justify-content:center}
.scan img{display:block;max-height:40vh;object-fit:contain}
.scan::after{content:"";position:absolute;left:0;right:0;height:3px;top:0;background:var(--resin);box-shadow:0 0 18px 4px var(--resin);animation:sweep 2.2s ease-in-out infinite alternate}
@keyframes sweep{to{top:calc(100% - 3px)}}
@media (prefers-reduced-motion: reduce){.scan::after{animation:none;top:auto;bottom:0}}
.status{font:700 22px/1.25 var(--display);margin-bottom:6px}

/* confirm form */
.form{display:grid;gap:14px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px 12px;font-size:17px}
.field input:focus,.field select:focus{border-color:var(--plum);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.terprow{display:grid;grid-template-columns:1fr 96px 44px;gap:8px;align-items:end}
.x{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1}
fieldset{border:0;padding:0;margin:0}
legend{font:700 18px/1.3 var(--display);margin-bottom:10px;padding:0}

/* result */
.prod{display:flex;gap:14px;align-items:center;margin:24px 0 4px}
.prod img{width:64px;height:64px;border-radius:12px;object-fit:cover}
.prod .nm{font:700 20px/1.2 var(--display)}
.chip{display:inline-block;border-radius:999px;padding:3px 11px;font-size:14px;background:var(--sage-soft);color:var(--ink);margin:6px 6px 0 0}
.strength{margin:26px 0 8px}
.big{font:800 clamp(72px,22vw,120px)/.9 var(--display);letter-spacing:-.045em;color:var(--plum)}
.big small{display:block;font-size:20px;letter-spacing:0;font-weight:700;color:var(--muted);margin-top:6px}
.tiername{font:700 26px/1.2 var(--display);margin:10px 0 4px}
.meter{position:relative;margin:18px 0 6px;padding-top:16px}
.bar{display:flex;height:16px;border-radius:999px;overflow:hidden;gap:2px}
.bar span{display:block;height:100%}
.bar .t0{background:var(--sage-soft)} .bar .t1{background:var(--resin-soft)} .bar .t2{background:color-mix(in srgb,var(--resin) 55%,var(--resin-soft))} .bar .t3{background:color-mix(in srgb,var(--plum) 60%,var(--plum-soft))}
.pin{position:absolute;top:0;width:4px;height:36px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.scale{display:flex;font-size:13px;color:var(--muted);margin-top:6px}
.scale span{flex:none}
.badge{display:inline-block;font-size:13px;border-radius:8px;padding:2px 8px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.b-solid{background:var(--sage-soft)} .b-early{background:var(--resin-soft)} .b-weak{background:var(--plum-soft)}
.profile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.pname{font:800 30px/1.1 var(--display);letter-spacing:-.02em;margin-bottom:6px}
.terps{display:grid;gap:14px;margin-top:18px}
.terp .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.terp .tn{font-weight:700}
.terp .tp{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.terp .track{height:8px;border-radius:999px;background:var(--sage-soft);margin:5px 0 4px;overflow:hidden}
.terp .fill{height:100%;background:var(--sage);border-radius:999px}
.terp .desc{font-size:15px;color:var(--muted)}
details{border-top:1px solid var(--line);padding:14px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font:700 18px/1.3 var(--display);list-style-position:outside}
details p{margin-top:10px}
.fb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.fb button{min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.fb button[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--on-plum)}
textarea{width:100%;min-height:70px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px 12px;resize:vertical}
.saved{font-size:14px;color:var(--sage);min-height:20px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:32px}
.del{background:none;border:0;color:var(--danger);cursor:pointer;font-size:14px;padding:6px}

.field.unsure input,.terprow.unsure input{border-color:var(--resin);background:var(--resin-soft)}
.hint{display:block;font-size:13px;color:var(--resin);font-weight:700;margin-top:3px}
.typepick{display:flex;flex-wrap:wrap;gap:8px}
.typepick button,.tags button{border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:8px 14px;cursor:pointer;font-size:15px}
.typepick button[aria-pressed="true"],.tags button[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--on-plum)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.prog{margin:4px 0 0;padding:0;list-style:none;font-size:16px}
.prog li{padding:3px 0;color:var(--muted)}
.prog li.done{color:var(--ink)}
.prog li.done::before{content:"\2713  ";color:var(--sage);font-weight:700}
.insight{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:18px 0}
.insight p:last-child{margin-bottom:0}
.syncline{font-size:14px;color:var(--muted);margin:4px 0 0}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}
.jarwrap{display:flex;gap:10px;align-items:center}
.jarwrap .pick{width:26px;height:26px;flex:none;accent-color:var(--plum)}
.jarwrap .jar{flex:1;min-width:0}
.cmp{margin-top:18px}
.cmph{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:6px}
.cmph div{font:700 19px/1.2 var(--display);overflow-wrap:anywhere}
.cmph img{width:48px;height:48px;border-radius:10px;object-fit:cover;display:block;margin-bottom:6px}
.cmpr{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;border-top:1px solid var(--line);padding:10px 0}
.cmpl{grid-column:1/-1;font-size:13px;color:var(--muted)}
.cmpc{font-size:16px;overflow-wrap:anywhere}
.stickybar{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper)}
.addside{background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:14px 16px}
.addside .grid2{margin-top:10px}
.addside .btn{min-height:48px;font-size:16px}
.gate{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px))}
.gate.terms{z-index:60}
.gate .inner{max-width:580px;margin:0 auto}
.check{display:flex;gap:12px;align-items:flex-start;margin:16px 0;font-size:16px;cursor:pointer}
.check input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:var(--plum)}
.disc{background:var(--plum-soft);border-radius:14px;padding:10px 14px;font-size:14px;margin:18px 0 0}
.foot{max-width:640px;margin:0 auto;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.foot a,.gate a{color:var(--plum)}
a[href^="tel:"]{white-space:nowrap}
.terms h3{margin-top:22px}
.closebar{display:flex;justify-content:flex-end}
</style>
</head>

<script>
/*LOGIC-START*/

const CLUSTERS = {
  spicy:{name:'Spicy citrus', aroma:'peppery and zesty, sometimes sweet like dessert', feel:'People often describe this profile as balanced or upbeat. That comes from user reports, not controlled studies.'},
  earthy:{name:'Earthy herbal', aroma:'musky, earthy and herbal, sometimes piney', feel:'This profile is often sold as relaxing or \u201ccouch\u201d flower. The research behind that is thin.'},
  bright:{name:'Bright and fresh', aroma:'piney, floral and fruity with a sweet herbal edge', feel:'This profile is often sold as energizing. That\u2019s mostly anecdotal.'},
  floral:{name:'Floral and soft', aroma:'lavender-floral', feel:'Linalool is linked to relaxation in animal and aromatherapy studies, but it hasn\u2019t been tested alongside THC.'},

};

const FEEL_TAGS = ['Relaxed', 'Happy', 'Energized', 'Focused', 'Creative', 'Sleepy', 'Hungry', 'Anxious', 'Foggy'];
const FB_LABEL = {much:'Too much', right:'Just right', mild:'Too mild'};

function num(v){
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  const s = String(v).trim().replace(',', '.');
  if (!s || /^(nd|n\/d|nt|<\s*lo[qd]|bql)/i.test(s)) return null;
  const m = s.match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
function round(v, p){ const f = Math.pow(10, p); return Math.round(v * f) / f; }
function fmt(v){ if (v === null || v === undefined || !isFinite(v)) return '\u2013'; if (Math.abs(v) < 1) return String(Math.round(v * 100) / 100); return v.toFixed(1); }
function fmtMg(v){ if (v === null || v === undefined || !isFinite(v)) return '\u2013'; return String(Math.round(v * 10) / 10); }
function fmtRatio(r){ return r >= 10 ? Math.round(r) : Math.round(r * 10) / 10; }
function titleCase(s){ s = String(s || '').trim(); return s ? s[0].toUpperCase() + s.slice(1) : s; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function parseGrams(w){
  if (!w) return null;
  const s = String(w).toLowerCase().replace(',', '.');
  if (/1\s*\/\s*8/.test(s)) return 3.5;
  if (/1\s*\/\s*4/.test(s)) return 7;
  if (/1\s*\/\s*2/.test(s)) return 14;
  const m = s.match(/(\d+(\.\d+)?)\s*(mg|g|gram|oz|ounce)/);
  if (!m) { const n = num(s); return n && n < 60 ? n : null; }
  if (m[3] === 'mg') return null;
  const n = parseFloat(m[1]);
  return /oz|ounce/.test(m[3]) ? n * 28 : n;
}
function toPct(value, unit, grams){
  const v = num(value);
  if (v === null) return null;
  const u = String(unit || '%').toLowerCase().replace(/\s/g, '');
  if (u === '%' || u === 'percent' || u === 'pct' || u === '%w/w') return v;
  if (u === 'mg/g') return v / 10;
  if (u === 'ppm') return v / 10000;
  if (u === 'mg') return grams ? v / (grams * 10) : null;
  return v;
}
function normType(t){
  const s = String(t || '').toLowerCase();
  if (/pre-?roll|joint|blunt|flower|bud/.test(s)) return 'flower';

  if (/concentrate|wax|shatter|rosin|resin|badder|budder|live|sauce|diamond|crumble|kief|hash|extract|rso/.test(s)) return 'concentrate';

function cannKey(key, printed){

  if (!s) return null;
  if (s.includes('total') || s.includes('max') || s.includes('potential')) {
    if (s.includes('cannabinoid') || s.includes('active') || s === 'tac') return 'TOTAL_CANNABINOIDS';
    if (s.includes('thc')) return 'TOTAL_THC';
    if (s.includes('cbd')) return 'TOTAL_CBD';
  }
  if (s === 'tac') return 'TOTAL_CANNABINOIDS';
  if (s.includes('thcv')) return s.includes('thcva') ? 'THCVA' : 'THCV';
  if (s.includes('delta8') || s.includes('d8thc') || s === 'd8') return 'D8THC';
  if (s.includes('thca')) return 'THCA';
  if (s.includes('thc')) return 'THC';
  if (s.includes('cbdv')) return 'CBDV';
  if (s.includes('cbda')) return 'CBDA';
  if (s.includes('cbd')) return 'CBD';
  if (s.includes('cbga')) return 'CBGA';
  if (s.includes('cbg')) return 'CBG';
  if (s.includes('cbn')) return 'CBN';
  if (s.includes('cbca')) return 'CBCA';

function terpKey(name){
  const s = String(name || '').toLowerCase()
    .replace(/\u03b1/g, 'alpha').replace(/\u03b2/g, 'beta').replace(/\u03b3/g, 'gamma').replace(/\u03b4/g, 'delta')
    .replace(/[^a-z]/g, '');

    ['caryophylleneoxide','caryophyllene_oxide'], ['caryophyllene','caryophyllene'], ['bcp','caryophyllene'],
    ['myrcene','myrcene'], ['limonene','limonene'], ['linalool','linalool'], ['terpinolene','terpinolene'],
    ['pinene','pinene'], ['humulene','humulene'], ['ocimene','ocimene'], ['bisabolol','bisabolol'],
    ['nerolidol','nerolidol'], ['guaiol','guaiol'], ['fenchol','fenchol'], ['fenchyl','fenchol'], ['terpineol','terpineol'],
    ['eucalyptol','eucalyptol'], ['cineole','eucalyptol'], ['camphene','camphene'], ['valencene','valencene'],
    ['geraniol','geraniol'], ['borneol','borneol'], ['farnesene','farnesene'], ['carene','carene'],
    ['phellandrene','phellandrene'], ['sabinene','sabinene'], ['terpinene','terpinene'], ['cymene','cymene'],

}
function terpSpecific(name){ return String(name || '').toLowerCase().replace(/[^a-z\u03b1\u03b2]/g, ''); }
function normSpecies(s){
  const t = String(s || '').toLowerCase();
  if (!t.trim()) return '';
  if (t.includes('indica') && (t.includes('hybrid') || t.includes('dominant'))) return 'Indica-leaning hybrid';
  if (t.includes('sativa') && (t.includes('hybrid') || t.includes('dominant'))) return 'Sativa-leaning hybrid';
  if (t.includes('hybrid')) return 'Hybrid';
  if (t.includes('indica')) return 'Indica';
  if (t.includes('sativa')) return 'Sativa';
  if (t.includes('cbd')) return 'CBD';

}
function normDate(s){
  const t = String(s || '').trim();
  if (!t) return '';
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`; }

}
function normBatch(b){ return String(b || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }

function emptyData(){
  return {type:'flower', name:'', brand:'', species:'', grams:null, batch:'', harvestDate:'', packageDate:'',
    cann:{TOTAL_THC:null, THCA:null, THC:null, TOTAL_CBD:null, CBDA:null, CBD:null, CBG:null, CBN:null, THCV:null, CBC:null},
    edible:{thcServing:null, thcTotal:null, cbdServing:null, servings:null},
    terps:[], totalTerps:null, unsure:[]};
}
function upgradeData(d){
  const e = emptyData();
  const out = Object.assign(e, d || {});
  out.cann = Object.assign(emptyData().cann, (d && d.cann) || {});
  out.edible = Object.assign(emptyData().edible, (d && d.edible) || {});
  out.terps = Array.isArray(out.terps) ? out.terps : [];
  out.unsure = Array.isArray(out.unsure) ? out.unsure : [];

}
function sumAcid(n, a){ if (n === null && a === null) return null; return (n || 0) + 0.877 * (a || 0); }

// Turn the model's raw reading into clean numbers.
function fromExtraction(out){
  const d = emptyData();
  if (!out || typeof out !== 'object') return {data:d, isLabel:false, note:''};
  d.type = normType(out.product_type);
  d.name = String(out.product_name || '').trim();
  d.brand = String(out.brand || '').trim();
  d.species = normSpecies(out.species);
  d.grams = parseGrams(out.net_weight);
  d.batch = String(out.batch_id || '').trim().slice(0, 40);
  d.harvestDate = normDate(out.harvest_date);
  d.packageDate = normDate(out.package_date);
  const raw = {}, unsureRaw = new Set();
  for (const c of (Array.isArray(out.cannabinoids) ? out.cannabinoids : [])) {
    if (!c) continue;
    const k = cannKey(c.key, c.printed_name);
    if (!k) continue;
    const p = toPct(c.value, c.unit, d.grams);
    if (p === null) continue;
    if (raw[k] === undefined || p > raw[k]) raw[k] = p;
    if (c.sure === false) unsureRaw.add(k);
  }
  const g = k => raw[k] ?? null;
  const map = {TOTAL_THC:['TOTAL_THC'], THCA:['THCA'], THC:['THC'], TOTAL_CBD:['TOTAL_CBD'], CBDA:['CBDA'], CBD:['CBD'],
    CBG:['CBG','CBGA'], CBN:['CBN'], THCV:['THCV','THCVA'], CBC:['CBC','CBCA']};
  d.cann.TOTAL_THC = g('TOTAL_THC'); d.cann.THCA = g('THCA'); d.cann.THC = g('THC');
  d.cann.TOTAL_CBD = g('TOTAL_CBD'); d.cann.CBDA = g('CBDA'); d.cann.CBD = g('CBD');
  d.cann.CBG = sumAcid(g('CBG'), g('CBGA')); d.cann.CBN = g('CBN');
  d.cann.THCV = sumAcid(g('THCV'), g('THCVA')); d.cann.CBC = sumAcid(g('CBC'), g('CBCA'));
  for (const f in map) if (map[f].some(k => unsureRaw.has(k)) && d.cann[f] !== null) d.unsure.push('c:' + f);
  const em = out.edible_mg && typeof out.edible_mg === 'object' ? out.edible_mg : {};
  d.edible.thcServing = num(em.thc_per_serving);
  d.edible.thcTotal = num(em.thc_total);
  d.edible.cbdServing = num(em.cbd_per_serving);
  d.edible.servings = num(em.servings);
  if (em.sure === false) for (const k of ['thcServing', 'thcTotal']) if (d.edible[k] !== null) d.unsure.push('e:' + k);
  const specific = {};
  for (const t of (Array.isArray(out.terpenes) ? out.terpenes : [])) {
    if (!t) continue;
    const nm = String(t.name || '');
    const p = toPct(t.value, t.unit, d.grams);
    if (/^total/i.test(nm.trim())) { if (p !== null) d.totalTerps = p; continue; }
    if (p === null || p <= 0) continue;
    const sk = terpSpecific(nm);
    if (!specific[sk] || specific[sk].pct < p) specific[sk] = {name:nm, pct:p, sure:t.sure !== false};

  d.terps = Object.values(specific).map(t => ({name:t.name, pct:round(t.pct, 3)}));
  for (const t of Object.values(specific)) if (!t.sure) d.unsure.push('t:' + terpSpecific(t.name));

  if (d.totalTerps !== null) d.totalTerps = round(d.totalTerps, 3);
  return {data:d, isLabel: out.is_cannabis_label !== false, note:String(out.unreadable || '').trim()};
}

// Fill blanks in base with what a second photo found.
function mergeData(base, add){
  const d = upgradeData(clone(base)), a = upgradeData(add);
  let added = 0;
  for (const k of ['name', 'brand', 'species', 'batch', 'harvestDate', 'packageDate']) if (!d[k] && a[k]) { d[k] = a[k]; added++; }
  if (!d.grams && a.grams) d.grams = a.grams;
  for (const k in d.cann) if (d.cann[k] === null && a.cann[k] !== null) {
    d.cann[k] = a.cann[k]; added++;
    if (a.unsure.includes('c:' + k)) d.unsure.push('c:' + k);
  }
  for (const k in d.edible) if (d.edible[k] === null && a.edible[k] !== null) {
    d.edible[k] = a.edible[k]; added++;
    if (a.unsure.includes('e:' + k)) d.unsure.push('e:' + k);
  }
  const have = new Set(d.terps.map(t => terpSpecific(t.name)));
  for (const t of a.terps) if (!have.has(terpSpecific(t.name))) {
    d.terps.push(t); added++;
    if (a.unsure.includes('t:' + terpSpecific(t.name))) d.unsure.push('t:' + terpSpecific(t.name));
  }
  if (d.totalTerps === null && a.totalTerps !== null) { d.totalTerps = a.totalTerps; added++; }
  const baseEmpty = Object.values(base.cann || {}).every(v => v === null) && !(base.terps || []).length;
  if (baseEmpty && a.type) d.type = a.type;
  return {data:d, added};
}

function groupTerps(terps){
  const groups = {};
  for (const t of terps || []) {
    const k = terpKey(t.name);
    if (!k || !(t.pct > 0)) continue;
    if (!groups[k]) groups[k] = {key:k, pct:0, name: TERPS[k] ? TERPS[k].name : titleCase(t.name)};
    groups[k].pct += t.pct;
  }
  return Object.values(groups).sort((a, b) => b.pct - a.pct);
}
function pickCluster(sorted, total){
  if (!sorted.length) return 'unknown';
  const top = sorted[0], second = sorted[1];
  if (total < 0.5 || top.pct < 0.2) return 'light';
  const k1 = top.key, k2 = second ? second.key : '';
  if (k1 === 'terpinolene' || k1 === 'ocimene') return 'bright';
  if ((k1 === 'myrcene' || k1 === 'pinene') && k2 === 'terpinolene') return 'bright';
  if (k1 === 'myrcene' || k1 === 'pinene') return 'earthy';
  if (k1 === 'caryophyllene' || k1 === 'limonene' || k1 === 'humulene') return 'spicy';
  if (k1 === 'linalool') return 'floral';

}
function ageInfo(d, now){
  const nowMs = now || Date.now();
  for (const [field, basis] of [['harvestDate', 'Harvested'], ['packageDate', 'Packaged']]) {
    if (!d[field]) continue;
    const t = Date.parse(d[field] + 'T12:00:00');
    if (isNaN(t)) continue;
    const days = Math.floor((nowMs - t) / 86400000);
    if (days < 0 || days > 3650) continue;

}
function ageText(age, type){
  if (!age) return '';
  const {days, basis} = age;
  const when = days < 14 ? `${days} day${days === 1 ? '' : 's'} ago` : days < 90 ? `about ${Math.round(days / 7)} weeks ago` : days < 365 ? `about ${Math.round(days / 30.4)} months ago` : 'over a year ago';
  if (type !== 'flower') return `${basis} ${when}.`;
  if (days < 90) return `${basis} ${when}, so it should still be fresh.`;
  if (days < 180) return `${basis} ${when}. The smell may be a little softer than when it was fresh.`;
  if (days < 365) return `${basis} ${when}. Flower this age typically has a quieter smell and a bit less THC than the label says, since THC slowly turns into CBN as flower ages.`;
  return `${basis} ${when}. Flower this age is typically noticeably weaker and less aromatic than the label suggests.`;
}

function analyze(dIn){
  const d = upgradeData(dIn);
  const type = d.type, cfg = TYPES[type], c = d.cann, warnings = [], flags = [];
  let total = null, source = '', cbd = null;
  if (cfg.unit === 'mg') {
    const e = d.edible;
    if (e.thcServing !== null) { total = e.thcServing; source = 'label'; }
    else if (e.thcTotal !== null && e.servings) { total = e.thcTotal / e.servings; source = 'calc'; }
    if (total === null && e.thcTotal !== null) {
      warnings.push(`Only the package total (${fmtMg(e.thcTotal)} mg THC) is listed. Check how many servings it holds before having any.`);
      flags.push('e:servings');
    }
    if (total !== null && total > cfg.sanity) { warnings.push(`${fmtMg(total)} mg per serving is unusually high. That number may have been misread.`); flags.push('e:thcServing'); }
    cbd = e.cbdServing;
  } else if (cfg.unit === 'pct') {
    const thc = c.THC, thca = c.THCA, stated = c.TOTAL_THC;
    let computed = null;
    if (thc !== null || thca !== null) computed = (thc || 0) + 0.877 * (thca || 0);
    if (computed !== null && stated !== null) {
      if (Math.abs(computed - stated) <= 1) { total = stated; source = 'label'; }
      else {
        total = computed; source = 'calc';
        warnings.push(`The label\u2019s total THC (${fmt(stated)}%) doesn\u2019t match what its THC and THCa numbers add up to (${fmt(computed)}%). Double-check those numbers. I used the calculated one.`);
        flags.push('c:TOTAL_THC', 'c:THCA', 'c:THC');
      }
    } else if (computed !== null) { total = computed; source = 'calc'; }
    else if (stated !== null) { total = stated; source = 'label'; }
    if (type === 'flower' && thca === null && stated === null && thc !== null && thc < 2) {
      warnings.push('Only a small THC number is listed, with no THCa. Flower\u2019s real strength usually comes from THCa, so this one is likely much stronger than it looks. Check the label for a THCa or total THC number.');
      flags.push('c:THCA', 'c:TOTAL_THC');
    }
    if (total !== null && total > cfg.sanity) {
      warnings.push(`${fmt(total)}% THC is higher than ${type === 'flower' ? 'flower' : 'this kind of product'} can test. That number may have been misread.`);
      flags.push(source === 'label' ? 'c:TOTAL_THC' : 'c:THCA');
    }
    const cbdCalc = (c.CBD !== null || c.CBDA !== null) ? (c.CBD || 0) + 0.877 * (c.CBDA || 0) : null;
    cbd = cbdCalc !== null ? cbdCalc : c.TOTAL_CBD;
    const cannSum = [c.THC, c.THCA, c.CBD, c.CBDA, c.CBG, c.CBN, c.THCV, c.CBC].reduce((a, v) => a + (v || 0), 0);
    if (cannSum > 100) warnings.push('The cannabinoid numbers add up to more than 100%, so something was misread.');
  }

    const cb = cbd || 0, low = cfg.unit === 'mg' ? 0.5 : 1;
    if (total < low && cb < low) chemo = 'low';
    else if (cb < 0.1 || total / Math.max(cb, 0.0001) > 5) chemo = 'I';
    else if (cb / Math.max(total, 0.0001) > 5) chemo = 'III';
    else chemo = 'II';
    if (cb >= 0.1 && total > 0) {
      const r = total >= cb ? total / cb : cb / total;

  if (total !== null && cfg.cuts) {
    let i = cfg.cuts.findIndex(x => cfg.unit === 'mg' ? total <= x : total < x);

    sorted = groupTerps(d.terps);
    const sumT = sorted.reduce((a, t) => a + t.pct, 0);
    totalT = d.totalTerps !== null ? d.totalTerps : sumT;
    if (totalT > (type === 'flower' ? 6 : 20)) warnings.push(`Total terpenes of ${fmt(totalT)}% is unusually high. Those numbers may have been misread.`);

}

function strengthText(a){
  if (a.total === null) return '';
  return a.cfg.unit === 'mg' ? `${fmtMg(a.total)} mg` : `${fmt(a.total)}%`;
}

// Same batch scanned again?
function findDuplicate(jars, data, excludeId){
  const b = normBatch(data.batch);
  const live = jars.filter(j => !j.deleted && j.id !== excludeId);
  if (b.length >= 4) { const hit = live.find(j => normBatch(j.data && j.data.batch) === b); if (hit) return hit; }
  const name = String(data.name || '').trim().toLowerCase();
  if (!name) return null;
  const a = analyze(data);
  if (a.total === null) return null;
  return live.find(j => {
    const jd = upgradeData(j.data);
    if (jd.name.trim().toLowerCase() !== name || jd.brand.trim().toLowerCase() !== String(data.brand || '').trim().toLowerCase() || jd.type !== upgradeData(data).type) return false;
    const ja = analyze(jd);
    return ja.total !== null && Math.abs(ja.total - a.total) < 0.05;
  }) || null;
}

// Personal patterns from rated jars.
function patterns(jars){
  const live = jars.filter(j => !j.deleted && j.feedback && (j.feedback.rating || (j.feedback.tags || []).length));
  const out = {count: live.length, strength:[], profiles:[]};
  const flower = live.filter(j => upgradeData(j.data).type === 'flower').map(j => ({j, a:analyze(j.data)})).filter(x => x.a.total !== null);
  const right = flower.filter(x => x.j.feedback.rating === 'right').map(x => x.a.total);
  const much = flower.filter(x => x.j.feedback.rating === 'much').map(x => x.a.total);
  const mild = flower.filter(x => x.j.feedback.rating === 'mild').map(x => x.a.total);
  if (right.length) out.strength.push(right.length === 1 ? `Flower at ${fmt(right[0])}% felt just right.` : `Flower that felt just right ranged from ${fmt(Math.min(...right))}% to ${fmt(Math.max(...right))}%.`);
  if (much.length) out.strength.push(`Flower started feeling like too much at ${fmt(Math.min(...much))}%.`);
  if (mild.length) out.strength.push(`Flower felt too mild at ${fmt(Math.max(...mild))}% and below.`);
  const byCluster = {};
  for (const j of live) {
    const a = analyze(j.data);
    if (!a.cfg.terps || ['unknown', 'light', 'mixed'].includes(a.cluster)) continue;
    const tags = j.feedback.tags || [];
    if (!tags.length) continue;
    const bc = byCluster[a.cluster] || (byCluster[a.cluster] = {n:0, tags:{}});
    bc.n++;
    for (const t of tags) bc.tags[t] = (bc.tags[t] || 0) + 1;
  }
  for (const k in byCluster) {
    const top = Object.entries(byCluster[k].tags).sort((x, y) => y[1] - x[1]).slice(0, 3).map(x => x[0].toLowerCase());
    out.profiles.push({cluster:k, n:byCluster[k].n, top});
  }
  return out;
}
function listJoin(a){ return a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }

// Photo quality from grayscale pixels.
function photoQuality(gray, w, h){
  let sum = 0;
  for (let i = 0; i < gray.length; i++) sum += gray[i];
  const mean = sum / gray.length;
  let s = 0, s2 = 0, n = 0;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x;
    const v = -4 * gray[i] + gray[i - 1] + gray[i + 1] + gray[i - w] + gray[i + w];
    s += v; s2 += v * v; n++;
  }
  const lapVar = n ? s2 / n - (s / n) * (s / n) : 0;
  let problem = null;
  if (mean < 45) problem = 'dark';
  else if (mean > 245 && lapVar < 60) problem = 'bright';
  else if (lapVar < 25) problem = 'blurry';
  return {mean, lapVar, problem};
}

// Pull live progress out of the partial JSON as it streams.
function progressFrom(text){
  const out = {name:'', type:'', cann:[], terps:0};
  const n = text.match(/"product_name"\s*:\s*"([^"]{1,60})"/); if (n) out.name = n[1];
  const t = text.match(/"product_type"\s*:\s*"([^"]{1,30})"/); if (t) out.type = TYPES[normType(t[1])].label;
  const seen = new Set();
  for (const m of text.matchAll(/"key"\s*:\s*"([A-Za-z0-9_]+)"/g)) {
    const k = m[1].toUpperCase();
    if (k === 'OTHER') continue;
    const label = {THCA:'THCa', TOTAL_THC:'total THC', TOTAL_CBD:'total CBD', CBDA:'CBDa', CBGA:'CBGa', THCVA:'THCVa', D8THC:'delta-8', TOTAL_CANNABINOIDS:'total cannabinoids'}[k] || k;
    seen.add(label);
  }
  out.cann = [...seen];
  const tb = text.indexOf('"terpenes"');
  if (tb >= 0) out.terps = (text.slice(tb).match(/"name"\s*:/g) || []).length;
  return out;
}

const STORE = 'budbud.jars.v1';
function migrateJar(j){
  if (!j || !j.id) return null;
  if (j.deleted) return {id:String(j.id), deleted:true, created:j.created || 0, updated:j.updated || 0};
  const created = j.created || Date.parse(j.date) || Date.now();
  let fb = j.feedback;
  if (!fb || typeof fb !== 'object') fb = {rating: fb || null, tags:[], note: j.note || ''};
  fb.tags = Array.isArray(fb.tags) ? fb.tags : [];
  fb.note = fb.note || '';
  return {id:String(j.id), created, updated:j.updated || created, data:upgradeData(j.data), thumb:j.thumb || '', feedback:fb};
}
const Store = {
  jars: [], col: null, cloud: false,
  loadLocal(){
    let raw = [];
    try { raw = JSON.parse(localStorage.getItem(STORE) || '[]'); } catch (e) {}
    this.jars = raw.map(migrateJar).filter(Boolean);
  },
  saveLocal(){
    const keep = this.jars.slice().sort((a, b) => b.created - a.created).slice(0, 200);
    try { localStorage.setItem(STORE, JSON.stringify(keep)); return true; }
    catch (e) {
      try { localStorage.setItem(STORE, JSON.stringify(keep.map((j, i) => i < 20 ? j : Object.assign({}, j, {thumb:''})))); return true; }
      catch (e2) { return false; }
    }
  },
  list(){ return this.jars.filter(j => !j.deleted).sort((a, b) => b.created - a.created); },
  get(id){ return this.jars.find(j => j.id === id && !j.deleted) || null; },
  put(jar){
    jar.updated = Date.now();
    const i = this.jars.findIndex(j => j.id === jar.id);
    if (i >= 0) this.jars[i] = jar; else this.jars.push(jar);
    const ok = this.saveLocal();
    this.push(jar);
    return ok;
  },
  remove(id){
    const j = this.jars.find(x => x.id === id);
    this.put({id, deleted:true, created: j ? j.created : Date.now()});
  },
  saveConsent(rec){
    this.pendingConsent = rec;
    if (!this.col) return;
    this.col.doc('consent').set(rec).then(() => { this.pendingConsent = null; }).catch(() => {});
  },
  push(jar){
    if (!this.col) return Promise.resolve();
    return this.col.doc(jar.id).set(clone(jar)).catch(() => {});
  },
  async init(){
    this.loadLocal();
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      this.col = db.collection('data/users/' + uid);
      await this.pull();
      this.cloud = true;
      if (this.pendingConsent) this.saveConsent(this.pendingConsent);
    } catch (e) { this.col = null; this.cloud = false; }
  },
  async pull(){
    if (!this.col) return false;
    const snap = await this.col.get();
    const local = new Map(this.jars.map(j => [j.id, j]));
    const remoteIds = new Map();
    for (const doc of snap.docs) {
      if (doc.id === 'consent') { onRemoteConsent(doc.data() || {}); continue; }
      const r = migrateJar(Object.assign({id:doc.id}, doc.data() || {}));
      if (!r) continue;
      remoteIds.set(r.id, r.updated);
      const l = local.get(r.id);
      if (!l || r.updated > l.updated) local.set(r.id, r);
    }
    this.jars = [...local.values()];
    this.saveLocal();
    for (const j of this.jars) if (!remoteIds.has(j.id) || j.updated > remoteIds.get(j.id)) await this.push(j);
    return true;
  }
};
Store.loadLocal();

async function blobToB64(b){ return await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(b); }); }
function parseLooseJSON(t){
  const s2 = String(t || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  try { return JSON.parse(s2); } catch (e) {}
  const a = s2.indexOf('{'), b = s2.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(s2.slice(a, b + 1)); } catch (e) {} }
  return undefined;
}
const webReader = {
  async json(_prompt, opts){
    opts = opts || {};
    const list = Array.isArray(opts.images) ? opts.images : [opts.images];
    const images = [];
    for (const im of list.slice(0, 2)) {
      const small = (await scaleTo(im, 1600, 0.85).catch(() => null)) || im;
      images.push({mime:'image/jpeg', data: await blobToB64(small)});
    }
    let res;
    try { res = await fetch('/api/read', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({images}), signal:opts.signal}); }
    catch (e) { throw {code: e && e.name === 'AbortError' ? 'cancelled' : 'upstream_error'}; }
    if (!res.ok) { let code = 'upstream_error'; try { code = (await res.json()).code || code; } catch (e) {} throw {code}; }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '', text = '';
    try {
      for (;;) {
        const {done, value} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream:true});
        let i;
        while ((i = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
          if (!line.startsWith('data:')) continue;
          let j; try { j = JSON.parse(line.slice(5)); } catch (e) { continue; }
          if (j.error) throw {code: j.error.code === 429 ? 'rate_limited' : 'upstream_error'};
          if (j.promptFeedback && j.promptFeedback.blockReason) throw {code:'refused'};
          const parts = (((j.candidates || [])[0] || {}).content || {}).parts || [];
          const add = parts.map(x => x.thought ? '' : (x.text || '')).join('');
          if (add) { text += add; if (opts.onText) opts.onText({text, delta:add}); }
        }
      }
    } catch (e) { if (e && e.code) throw e; throw {code: e && e.name === 'AbortError' ? 'cancelled' : 'upstream_error'}; }
    const out = parseLooseJSON(text);
    if (out === undefined) throw {code:'invalid_json', text};
    return out;
  }
};

const reportedMsgs = new Set(); let reportCount = 0;
function deviceInfo(){ return {version:APP_VERSION, screen:state.screen, ua:navigator.userAgent.slice(0, 200), width:window.innerWidth}; }
async function sendReport({kind, message, details, contact}){
  const res = await fetch('/api/report', {method:'POST', headers:{'content-type':'application/json'},
    body:JSON.stringify({kind, message, contact:contact || '', details:JSON.stringify(Object.assign(deviceInfo(), details || {}))})});
  if (!res.ok) throw new Error('report failed ' + res.status);
  return true;
}
function autoReport(err, where){
  const msg = String((err && (err.message || err.code)) || err || 'Unknown error').slice(0, 300);
  track('app_error', {where, message:msg.slice(0, 100)});
  if (!IS_WEB || reportCount >= 3 || reportedMsgs.has(msg)) return;
  reportedMsgs.add(msg); reportCount++;
  sendReport({kind:'Automatic error', message:msg, details:{where, stack:String((err && err.stack) || '').slice(0, 800)}}).catch(() => {});
}
window.addEventListener('error', e => autoReport(e.error || e.message, 'window'));

// ---------- photos ----------
async function loadBitmap(file){
  try { return await createImageBitmap(file, {imageOrientation:'from-image'}); } catch (e) {}
  return await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); });
}
async function drawScaled(file, max){
  const bmp = await loadBitmap(file);
  const w = bmp.width, h = bmp.height, k = Math.min(1, max / Math.max(w, h));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  return cv;
}
async function scaleTo(file, max, q, asURL){
  const cv = await drawScaled(file, max);
  if (asURL) return cv.toDataURL('image/jpeg', q);
  return await new Promise(r => cv.toBlob(b => r(b), 'image/jpeg', q));
}
async function assessPhoto(file){
  try {
    const cv = await drawScaled(file, 480);
    const {data} = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height);
    const gray = new Float32Array(cv.width * cv.height);
    for (let i = 0, p = 0; i < gray.length; i++, p += 4) gray[i] = 0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2];
    return photoQuality(gray, cv.width, cv.height);
  } catch (e) { return {problem:null}; }
}

async function onFiles(fileList){
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const add = state.addMode; state.addMode = false;
  track('scan_start', {source: add ? 'add_side' : 'photo'});
  view.innerHTML = `<p class="status" style="margin-top:40px">Getting the photo ready\u2026</p>`;
  await aiP;
  const max = imageLimits ? imageLimits.maxCount : 1;
  const list = files.slice(0, Math.max(1, add ? 1 : max));
  const jpegs = [];
  for (const f of list) { try { jpegs.push((await scaleTo(f, 2000, 0.9)) || f); } catch (e) { jpegs.push(f); } }
  let problem = null;
  for (const j of jpegs) { const q = await assessPhoto(j); if (q.problem) { problem = q.problem; break; } }
  state.pending = {jpegs, add};
  if (problem) track('photo_quality_warning', {problem});
  if (problem) { go(() => renderQuality(problem, jpegs[0], add)); return; }
  await usePending();
}
async function usePending(){
  const {jpegs, add} = state.pending || {};
  state.pending = null;
  if (!jpegs) return;
  if (!add) {
    resetScan();
    state.photos = jpegs; state.fromPhoto = true;
    try { state.thumb = await scaleTo(jpegs[0], 240, 0.72, true); } catch (e) { state.thumb = ''; }
  }
  state.photoURL = URL.createObjectURL(jpegs[0]);
  if (!sampleFn || !imageLimits) {
    if (!add) state.data = emptyData();
    state.readNote = 'Photo reading isn\u2019t available here, so type the numbers from the label.';
    go(renderConfirm); return;
  }
  readLabel(jpegs, add);
}

function renderQuality(problem, blob, add){
  state.screen = 'quality';
  const msg = {
    blurry:['This photo looks blurry.', 'Blurry numbers are easy to misread. Hold steady, tap the label to focus, and try again.'],
    dark:['This photo is too dark.', 'Move somewhere brighter or turn on a light, then try again.'],
    bright:['This photo is washed out.', 'Glare or too much light is hiding the text. Tilt the jar a little and try again.']
  }[problem];
  view.innerHTML = `<div class="scan" style="margin-top:24px"><img src="${esc(URL.createObjectURL(blob))}" alt="Your photo"></div>
    <h1 style="font-size:clamp(32px,9vw,44px);margin-top:10px">${esc(msg[0])}</h1><p class="lede">${esc(msg[1])}</p>
    <div class="stack">${photoButtons(add ? 'add' : '', 'Take it again', 'Choose a different photo')}
      <button class="btn btn-secondary" id="useAnyway">Use it anyway</button></div>`;
  $('#useAnyway').onclick = () => usePending();
}

const EXTRACT_PROMPT = `You are reading the label on a cannabis product (a jar, bag, box, cart or package) from the attached photo(s). Transcribe the product information exactly. Do not calculate, estimate, or fill in anything that is not printed.

Reply with ONLY one JSON object, with the fields in this order:
{"is_cannabis_label": true,
 "product_type": "flower, pre-roll, vape, concentrate, edible, tincture, capsule, topical or other",
 "product_name": "strain or product name, or null",
 "brand": "grower or brand, or null",
 "species": "as printed, e.g. Indica, Sativa, Hybrid, Indica-dominant hybrid, or null",
 "net_weight": "as printed, e.g. 3.5 g, or null",
 "batch_id": "batch, lot or harvest-lot number as printed, or null",
 "harvest_date": "YYYY-MM-DD or null",
 "package_date": "YYYY-MM-DD or null",
 "cannabinoids": [{"key": "THCa", "printed_name": "THCA", "value": 24.8, "unit": "%", "sure": true}],
 "edible_mg": {"thc_per_serving": null, "thc_total": null, "cbd_per_serving": null, "servings": null, "sure": true},
 "terpenes": [{"name": "beta-Caryophyllene", "value": 0.61, "unit": "%", "sure": true}],
 "total_terpenes": {"value": 2.05, "unit": "%"},
 "unreadable": ""}

Rules:
- "key" must be one of: THC, THCa, TOTAL_THC, CBD, CBDa, TOTAL_CBD, CBG, CBGa, CBN, CBC, CBCa, THCV, THCVa, CBDV, D8THC, TOTAL_CANNABINOIDS, OTHER. Plain "THC", "D9-THC" or "delta-9 THC" is THC. "Total THC", "Total Potential THC", "Max THC" or "Total Active THC" is TOTAL_THC. "Total Cannabinoids", "TAC" or "Total Active Cannabinoids" is TOTAL_CANNABINOIDS.
- "unit" must be one of: "%", "mg/g", "mg". If a value is shown in both % and mg, give the % version in "cannabinoids".
- For edibles, tinctures and capsules, fill "edible_mg" with the milligram amounts printed per serving and per package, and the number of servings. Otherwise leave it all null.
- Copy numbers exactly as printed. Leave out anything marked ND, <LOQ, <LOD or NT.
- Set "sure" to false for any number that is blurry, partly hidden, or where a digit could be read two ways. Otherwise true.
- List every terpene printed, including minor ones. Use total_terpenes only if a total is printed; otherwise null.
- Dates: convert to YYYY-MM-DD only when unambiguous (US labels use month/day/year). Otherwise null.
- If a number is unreadable, leave it out and mention it briefly in "unreadable" rather than guessing.
- If the photo is not a cannabis product label, set is_cannabis_label to false and leave the rest empty or null.`;

let ctl = null;
async function readLabel(photos, add){
  state.screen = 'reading';
  view.innerHTML = `
    <div class="scan"><img src="${esc(state.photoURL)}" alt="Your label photo"></div>
    <p class="status" id="stat">${add ? 'Reading this side\u2026' : 'Reading the label\u2026'}</p>
    <ul class="prog" id="prog"><li>Looking at the photo</li></ul>
    <p class="muted small" id="waitNote" style="margin-top:10px">${IS_WEB ? 'This usually takes 5 to 20 seconds.' : 'The first time, Claude will ask permission to read the photo.'}</p>
    <button class="btn btn-secondary" id="stopBtn" style="margin-top:18px">Cancel</button>`;
  ctl = new AbortController();
  const myCtl = ctl;
  $('#stopBtn').onclick = () => myCtl.abort();
  const started = Date.now();
  const timer = setInterval(() => {
    const w = $('#waitNote'); if (!w) return;
    const s = Math.round((Date.now() - started) / 1000);
    if (s >= 15) w.textContent = s >= 45 ? 'Still going. Busy labels with lots of terpenes take longest.' : 'Still reading. This usually takes 10 to 40 seconds.';
  }, 1000);
  const onText = ({text}) => {
    const p = progressFrom(text), el = $('#prog');
    if (!el) return;
    const items = ['<li class="done">Looking at the photo</li>'];
    if (p.name || p.type) items.push(`<li class="done">Found ${esc([p.type, p.name].filter(Boolean).join(': '))}</li>`);
    if (p.cann.length) items.push(`<li class="done">Read ${esc(listJoin(p.cann.slice(0, 5)))}${p.cann.length > 5 ? ' and more' : ''}</li>`);
    if (p.terps) items.push(`<li class="done">Found ${p.terps} terpene${p.terps === 1 ? '' : 's'}</li>`);
    el.innerHTML = items.join('');
  };
  try {
    const out = await sampleFn.json(EXTRACT_PROMPT, {images: photos, signal: myCtl.signal, modelTier: 'default', onText});
    clearInterval(timer);
    const r = fromExtraction(out);
    if (!r.isLabel) {
      go(() => renderProblem('That doesn\u2019t look like a cannabis label.', 'Try again with the label filling most of the frame, in good light.', true, add));
      return;
    }
    if (add) {
      const m = mergeData(state.data || emptyData(), r.data);
      state.data = m.data;
      state.readNote = m.added ? `Added ${m.added} new value${m.added === 1 ? '' : 's'} from that photo.` : 'That photo didn\u2019t have anything new. The numbers below are unchanged.';
    } else {
      state.data = r.data;
      track('scan_success', {product_type:r.data.type});
      const found = Object.values(r.data.cann).some(v => v !== null) || r.data.terps.length || Object.values(r.data.edible).some(v => v !== null);
      state.readNote = found ? (r.note ? `Couldn\u2019t read everything: ${r.note}` : '') : 'No numbers came through from that photo. Try a closer, sharper shot, or type them in below.';
    }
    go(renderConfirm);
  } catch (e) {
    clearInterval(timer);
    const code = e && e.code;
    track('scan_error', {code:String(code || 'unknown')});
    if (code === 'upstream_error' || code === 'invalid_json') autoReport({message:'Scan failed: ' + code}, 'scan');
    if (code === 'cancelled') { go(add ? renderConfirm : renderHome); return; }
    const msgs = {
      not_granted: ['Photo reading is turned off.', 'Allow Claude to read photos when asked, or type the numbers in instead.'],
      sampling_disabled: ['Photo reading isn\u2019t available on this account.', 'You can still type the numbers in.'],
      rate_limited: ['Too many scans in a row.', 'Wait a minute and try again, or type the numbers in.'],
      image_rejected: ['That photo couldn\u2019t be used.', 'Try a different photo, a JPEG or PNG taken with the camera.'],
      refused: ['That photo couldn\u2019t be read.', 'Try another shot of the label, or type the numbers in.'],
      session_expired: ['You\u2019ve been signed out of Claude.', 'Sign back in and try again.'],
      invalid_json: ['The reading came back garbled.', 'Try again, ideally with a closer shot of the numbers.']
    };
    const m = msgs[code] || ['Something interrupted the reading.', 'Check your connection and try again.'];
    state.lastPhotos = photos;
    go(() => renderProblem(m[0], m[1], code !== 'not_granted' && code !== 'sampling_disabled', add));
  }
}

function renderProblem(title, detail, canRetry, add){
  state.screen = 'problem';
  const retry = canRetry && state.lastPhotos && state.lastPhotos.length;
  view.innerHTML = `<h1 style="font-size:clamp(34px,9vw,48px)">${esc(title)}</h1><p class="lede">${esc(detail)}</p>
    <div class="stack">
      ${retry ? `<button class="btn btn-primary" id="retry">Try this photo again</button>` : ''}
      ${photoButtons(add ? 'add' : '', 'Take a new photo', 'Choose a different photo', !retry)}
      <button class="btn btn-secondary" id="manual">${add ? 'Back to the numbers' : 'Type it in instead'}</button>
    </div>`;
  const rt = $('#retry'); if (rt) rt.onclick = () => readLabel(state.lastPhotos, add);
  $('#manual').onclick = () => { if (!add) state.data = emptyData(); state.readNote = ''; go(renderConfirm); };
}

// ---------- confirm ----------
const CANN_FIELDS = [
  ['TOTAL_THC', 'Total THC'], ['THCA', 'THCa'], ['THC', 'THC (delta-9)'],
  ['TOTAL_CBD', 'Total CBD'], ['CBDA', 'CBDa'], ['CBD', 'CBD'],
  ['CBG', 'CBG'], ['CBN', 'CBN'], ['THCV', 'THCV']
];
const EDIBLE_FIELDS = [['thcServing', 'THC per serving (mg)'], ['servings', 'Servings in package'], ['thcTotal', 'THC in whole package (mg)'], ['cbdServing', 'CBD per serving (mg)']];
const SPECIES = ['', 'Indica', 'Indica-leaning hybrid', 'Hybrid', 'Sativa-leaning hybrid', 'Sativa', 'CBD'];

function readForm(){
  const nd = upgradeData(clone(state.data || emptyData()));
  const val = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  if (val('f-name') === undefined) return nd;
  nd.name = val('f-name').trim(); nd.brand = val('f-brand').trim(); nd.species = val('f-sp');
  nd.batch = val('f-batch').trim(); nd.harvestDate = val('f-hd') || ''; nd.packageDate = val('f-pd') || '';
  const cfg = TYPES[nd.type];
  if (cfg.unit === 'mg') for (const [k] of EDIBLE_FIELDS) nd.edible[k] = num(val('e-' + k));
  else {
    for (const [k] of CANN_FIELDS) nd.cann[k] = num(val('c-' + k));
    if (cfg.terps) {
      nd.totalTerps = num(val('f-tt'));
      nd.terps = [];
      view.querySelectorAll('.terprow').forEach(r => {
        const n = r.querySelector('.t-n').value.trim(), p = num(r.querySelector('.t-p').value);
        if (n && p !== null && p > 0) nd.terps.push({name:n, pct:p});
      });
    }
  }
  nd.unsure = [...view.querySelectorAll('.unsure[data-key]')].map(x => x.dataset.key);
  return nd;
}

function renderConfirm(){
  state.screen = 'confirm';
  const d = upgradeData(state.data || emptyData());
  state.data = d;
  const cfg = TYPES[d.type];
  const v = x => x === null || x === undefined ? '' : String(x);
  const flagged = new Set([...d.unsure, ...analyze(d).flags]);
  const f = key => flagged.has(key) ? ' unsure' : '';
  const hint = key => flagged.has(key) ? '<span class="hint">Check this</span>' : '';
  const spOpts = SPECIES.includes(d.species) ? SPECIES : SPECIES.concat([d.species]);
  const nFlag = [...flagged].filter(k => {
    if (k.startsWith('c:')) return cfg.unit === 'pct';
    if (k.startsWith('e:')) return cfg.unit === 'mg';
    if (k.startsWith('t:')) return cfg.terps && d.terps.some(t => 't:' + terpSpecific(t.name) === k);
    return false;
  }).length;
  let numbers = '';
  if (cfg.unit === 'mg') {
    numbers = `<fieldset><legend>THC and CBD (mg)</legend><div class="grid2">${EDIBLE_FIELDS.map(([k, l]) => `<div class="field${f('e:' + k)}" data-key="e:${k}"><label for="e-${k}">${l}</label><input id="e-${k}" inputmode="decimal" value="${esc(v(d.edible[k]))}">${hint('e:' + k)}</div>`).join('')}</div></fieldset>`;
  } else if (cfg.unit === 'pct') {
    numbers = `<fieldset><legend>Cannabinoids (%)</legend>
      <div class="grid3">${CANN_FIELDS.map(([k, l]) => `<div class="field${f('c:' + k)}" data-key="c:${k}"><label for="c-${k}">${l}</label><input id="c-${k}" inputmode="decimal" value="${esc(v(d.cann[k]))}">${hint('c:' + k)}</div>`).join('')}</div></fieldset>
      ${cfg.terps ? `<fieldset><legend>Terpenes (%)</legend><div id="terps" class="form"></div>
        <div class="grid2" style="margin-top:12px">
          <button class="btn btn-secondary" id="addT" type="button" style="min-height:48px;font-size:16px">Add a terpene</button>
          <div class="field"><label for="f-tt">Total terpenes</label><input id="f-tt" inputmode="decimal" value="${esc(v(d.totalTerps))}"></div>
        </div></fieldset>` : ''}`;
  } else {
    numbers = `<p class="muted">Topicals don\u2019t need numbers here. Tap below to see what to expect.</p>`;
  }
  view.innerHTML = `
    <h1 style="font-size:clamp(38px,10vw,56px)">Check the numbers</h1>
    <p class="lede">${state.fromPhoto ? 'Here\u2019s what came off the label. Fix anything that looks off.' : 'Copy what\u2019s printed on the label. Leave blanks for anything not listed.'}</p>
    <p class="muted small">Always compare these with the actual label before relying on anything that follows.</p>
    ${state.readNote ? `<div class="note">${esc(state.readNote)}</div>` : ''}
    ${nFlag ? `<div class="note warn">${nFlag} value${nFlag === 1 ? ' is' : 's are'} worth a second look. ${nFlag === 1 ? 'It\u2019s' : 'They\u2019re'} highlighted below.</div>` : ''}
    <div class="form">
      <fieldset><legend>What kind of product</legend><div class="typepick" role="group">${TYPE_ORDER.map(t => `<button type="button" data-type="${t}" aria-pressed="${t === d.type}">${TYPES[t].label}</button>`).join('')}</div></fieldset>
      <div class="field"><label for="f-name">Strain or product</label><input id="f-name" value="${esc(d.name)}" autocomplete="off"></div>
      <div class="grid2">
        <div class="field"><label for="f-brand">Brand</label><input id="f-brand" value="${esc(d.brand)}" autocomplete="off"></div>
        <div class="field"><label for="f-sp">Type on label</label><select id="f-sp">${spOpts.map(s => `<option value="${esc(s)}"${s === d.species ? ' selected' : ''}>${esc(s || 'Not listed')}</option>`).join('')}</select></div>
      </div>
      ${numbers}
      <div class="grid3">
        <div class="field"><label for="f-batch">Batch or lot</label><input id="f-batch" value="${esc(d.batch)}" autocomplete="off"></div>
        <div class="field"><label for="f-hd">Harvest date</label><input id="f-hd" type="date" value="${esc(d.harvestDate)}"></div>
        <div class="field"><label for="f-pd">Package date</label><input id="f-pd" type="date" value="${esc(d.packageDate)}"></div>
      </div>
      <div class="addside">
        <h3>Something missing?</h3>
        <p class="muted small" style="margin:0">Terpenes or dates are often on another side. Add a photo of it and I\u2019ll fill in the blanks.</p>
        <div class="grid2">${photoButtons('add', 'Photo another side', 'Choose a photo', false)}</div>
      </div>
      <button class="btn btn-primary" id="goBtn" style="margin-top:10px">Show me what to expect</button>
    </div>`;
  view.querySelectorAll('[data-type]').forEach(b => b.onclick = () => {
    const nd = readForm(); nd.type = b.dataset.type; state.data = nd; renderConfirm();
  });
  view.querySelectorAll('.field input').forEach(inp => inp.addEventListener('input', () => {
    const fld = inp.closest('.field'); if (fld) { fld.classList.remove('unsure'); const h = fld.querySelector('.hint'); if (h) h.remove(); }
  }));
  const terpBox = $('#terps');
  if (terpBox) {
    const addRow = (t) => {
      const row = document.createElement('div');
      const key = t ? 't:' + terpSpecific(t.name) : '';
      row.className = 'terprow' + (t && flagged.has(key) ? ' unsure' : '');
      if (key) row.dataset.key = key;
      row.innerHTML = `<div class="field"><label>Name</label><input class="t-n" value="${esc(t ? t.name : '')}" placeholder="e.g. Limonene" autocomplete="off"></div>
        <div class="field"><label>%</label><input class="t-p" inputmode="decimal" value="${esc(t ? t.pct : '')}">${t && flagged.has(key) ? '<span class="hint">Check this</span>' : ''}</div>
        <button class="x" type="button" aria-label="Remove terpene">\u00d7</button>`;
      row.querySelector('.x').onclick = () => row.remove();
      row.querySelectorAll('input').forEach(i => i.addEventListener('input', () => { row.classList.remove('unsure'); const h = row.querySelector('.hint'); if (h) h.remove(); }));
      terpBox.appendChild(row);
    };
    (d.terps.length ? d.terps : [null, null, null]).forEach(addRow);
    $('#addT').onclick = () => addRow(null);
  }
  $('#goBtn').onclick = () => {
    const nd = readForm();
    const cfg2 = TYPES[nd.type];
    const hasAny = cfg2.unit === 'none' || (cfg2.unit === 'mg' ? Object.values(nd.edible).some(x => x !== null) : (Object.values(nd.cann).some(x => x !== null) || nd.terps.length));
    if (!hasAny) { alert(cfg2.unit === 'mg' ? 'Add the THC per serving from the label.' : 'Add at least the THC or THCa number from the label.'); return; }
    nd.unsure = [];
    state.data = nd;
    saveCurrent();
    go(renderResult);
  };
}

function saveCurrent(){
  state.dupNote = '';
  if (!state.jarId) {
    const dup = findDuplicate(Store.jars, state.data, null);
    if (dup) {
      state.jarId = dup.id;
      state.dupNote = `You scanned this batch on ${new Date(dup.created).toLocaleDateString(undefined, {month:'long', day:'numeric'})}. I updated that jar instead of adding a duplicate, and kept your rating and notes.`;
    }
  }
  const existing = state.jarId ? Store.jars.find(j => j.id === state.jarId && !j.deleted) : null;
  const jar = existing ? Object.assign({}, existing, {data: state.data, thumb: state.thumb || existing.thumb || ''})
    : {id: 'j' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), created: Date.now(), data: state.data, thumb: state.thumb || '', feedback:{rating:null, tags:[], note:''}};
  state.jarId = jar.id;
  Store.put(jar);
}

// ---------- result ----------
function renderResult(){
  state.screen = 'result';
  const d = upgradeData(state.data), a = analyze(d), cfg = a.cfg;
  const cl = CLUSTERS[a.cluster];
  const current = Store.get(state.jarId);
  const fb = current ? current.feedback : {rating:null, tags:[], note:''};
  const isMg = cfg.unit === 'mg';
  track('result_view', {product_type:a.type, tier:a.tier ? a.tier.key : 'none'});
  const pinPos = a.total !== null && cfg.meterMax ? Math.min(a.total, cfg.meterMax) / cfg.meterMax * 100 : null;
  const segs = cfg.cuts ? [cfg.cuts[0], cfg.cuts[1] - cfg.cuts[0], cfg.cuts[2] - cfg.cuts[1]].map(x => x / cfg.meterMax * 100) : [];

  let expect = '';
  if (a.type === 'topical') expect = 'Creams and balms applied to skin generally don\u2019t produce a high. Transdermal patches are the exception and act more like an edible.';
  else if (a.total === null) expect = `There\u2019s no THC number to go on, so strength can\u2019t be judged. Add the ${isMg ? 'THC per serving' : 'THC or THCa number'} from the label to get a read.`;
  else if (a.chemo === 'III') expect = 'Mostly CBD, with very little THC. Products like this are typically associated with a much milder high, if any.';
  else if (a.chemo === 'II') expect = `A balanced product (${a.ratio}). Each ${isMg ? 'serving' : 'puff'} carries less THC than a THC-heavy one, so products like this are typically associated with a gentler high.`;
  else if (a.chemo === 'low') expect = 'Very low in both THC and CBD, which typically means little effect.';
  else {
    const w = {low:'a noticeable but manageable', moderate:'a clear', high:'a strong', vhigh:'a very strong'}[a.tier.key];
    const when = cfg.route === 'eaten' ? 'that builds slowly, usually starting 30 minutes to 2 hours after eating' : cfg.route === 'tincture' ? 'that starts within 15 minutes to 2 hours, depending on whether you hold it under your tongue or swallow it' : 'that starts within a few minutes of your first puff';
    expect = `THC is the main active ingredient here. Based on the label numbers, products like this are typically associated with ${w} high ${when}.`;
  }
  if (cfg.terps && !['unknown', 'light'].includes(a.cluster) && cl.aroma) expect += ` The aroma is likely ${cl.aroma}.`;

  const others = [];
  if (a.chemo === 'I' && a.total !== null) others.push('There\u2019s little to no CBD here, so don\u2019t count on it to soften anything.');
  if (a.chemo === 'II') others.push('The idea that CBD cancels out THC didn\u2019t hold up in the best trial so far. The gentler feel comes from getting less THC.');
  if (cfg.unit === 'pct') {
    if (d.cann.CBN !== null && d.cann.CBN >= 0.1) others.push(`CBN ${fmt(d.cann.CBN)}%. At these levels it\u2019s unlikely to make you noticeably sleepier. Higher CBN can mean older product, since it forms as THC ages.`);
    if (d.cann.CBG !== null && d.cann.CBG >= 0.3) others.push(`CBG ${fmt(d.cann.CBG)}%. Early small studies hint at calm without impairment, but amounts this low usually don\u2019t matter.`);
    if (d.cann.THCV !== null && d.cann.THCV >= 0.1) others.push(`THCV ${fmt(d.cann.THCV)}%. The \u201cenergy\u201d and \u201cappetite\u201d claims aren\u2019t established.`);
  }
  if (d.species) others.push(`Labeled ${d.species}. Genetic studies show these labels don\u2019t reliably predict how a product feels, so the chemistry above is a better guide.`);

  let anxiety = '';
  if (a.tier && a.tier.index >= 2) {
    anxiety = `Higher THC is linked to a greater chance of anxiety or paranoia, especially for people who use cannabis infrequently. Severe or frightening symptoms are a reason to seek medical help.`;
    if (a.limoneneNotable) anxiety += ' This product lists a fair amount of limonene, which one small study linked to less THC-related anxiety. That is early evidence and says nothing certain about any individual.';
  }

  // personal history
  const others2 = Store.list().filter(j => j.id !== state.jarId);
  const similar = a.total === null ? [] : others2.filter(j => {
    if (!j.feedback || !j.feedback.rating) return false;
    const ja = analyze(j.data);
    if (ja.total === null || ja.cfg.lines !== cfg.lines) return false;
    return Math.abs(ja.total - a.total) <= (isMg ? 2.5 : cfg.unit === 'pct' && a.type !== 'flower' ? 5 : 3);
  }).slice(0, 2);
  const sameProfile = cfg.terps && !['unknown', 'light', 'mixed'].includes(a.cluster) ? others2.filter(j => (j.feedback.tags || []).length && analyze(j.data).cluster === a.cluster) : [];

  for (const j of sameProfile) for (const t of j.feedback.tags) tagCount[t] = (tagCount[t] || 0) + 1;

  state.dupNote = '';
